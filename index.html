<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meu App Web</title>
  <link rel="stylesheet" href="src/style.css" />
</head>
<body>
  <div class="app-container">
    <header>
      <h1>Meu App</h1>
      <p>Pronto para deploy no GitHub Pages / Vercel / Netlify</p>
    </header>

    <main>
      <form id="task-form" class="input-group">
        <input type="text" id="task-input" placeholder="Adicione uma nova tarefa ou item..." required />
        <button type="submit">Adicionar</button>
      </form>

      <ul id="task-list" class="task-list"></ul>
    </main>

    <footer>
      <small>Desenvolvido e hospedado via GitHub</small>
    </footer>
  </div>

  <script src="src/app.js"></script>
</body>
</html>
